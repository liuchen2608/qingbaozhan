<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>情报站 · AI Intelligence Hub</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div><h1>情报站 <small>AI Intelligence Hub</small></h1><p>让 AI 动态成为你的产品判断力。</p></div><span id="status">检查模型配置…</span></header>
<nav><button data-view="library">情报知识库</button><button data-view="sources">信息源</button><button data-view="reports">日报与周报</button><a href="/api/export?format=markdown">导出 Markdown</a><a href="/api/export?format=xlsx">导出 Excel</a></nav>
<p id="message" role="status" aria-live="polite"></p>
<main><section id="library"><div class="toolbar"><h2>情报知识库</h2><button id="add-item">＋ 录入情报</button><label>导入情报 <input id="import-items" type="file" accept=".csv,.json,.xlsx"></label></div>
<p class="hint">先录入原文链接和正文，再进行 AI 分析。系统不会自动获取 X 正文；仅有链接时也可先保存。</p>
<form id="filters" class="filters"><input name="q" placeholder="搜索标题、正文、笔记与分析" aria-label="关键词"><select name="category" id="filter-category" aria-label="分类"><option value="">全部分类</option></select><label>起始日期<input name="start" type="date"></label><label>结束日期<input name="end" type="date"></label><select name="min_score" aria-label="最低评分"><option value="0">全部评分</option><option value="80">80+ 重点研究</option><option value="60">60+ 值得关注</option><option value="40">40+ 普通信息</option></select><select name="sort" aria-label="排序"><option value="date">最新发布</option><option value="score">评分优先</option></select><label><input type="checkbox" name="favorite" value="true">仅收藏</label><button>筛选</button></form><div id="items"></div></section>
<section id="sources" hidden><div class="toolbar"><h2>信息源</h2><button id="add-source">＋ 添加信息源</button><label>导入信息源 <input id="import-sources" type="file" accept=".csv,.json,.xlsx"></label></div><p class="hint">账号以你的清单为准，不预置未经确认的账号。启停仅表示管理状态，本版不自动采集。导入列名见 README。</p><div id="source-list"></div></section>
<section id="reports" hidden><h2>日报与周报</h2><p>北京时间，按原文发布时间筛选，评分≥60且分析有效，最多10条。周报整理截至所选日期的7天。</p><form id="report-form"><input type="date" id="report-day" required aria-label="报告日期"><select id="report-period"><option value="daily">日报</option><option value="weekly">周报</option></select><button>生成报告</button><button type="button" id="download-report">下载 Markdown</button></form><pre id="report-output">尚未生成报告。</pre></section></main>
<dialog id="editor"><form id="item-form"><h2 id="editor-title">录入情报</h2><input name="id" type="hidden"><label>标题<input name="title" required maxlength="300"></label><label>原文链接<input name="url" type="url" required></label><div class="columns"><label>作者<input name="author"></label><label>发布时间（北京时间）<input name="published_at" type="datetime-local" required></label><label>关联信息源<select name="source_id" id="item-source"><option value="">无</option></select></label></div><label>原文正文<textarea name="content" rows="9" maxlength="60000"></textarea></label><label>个人笔记<textarea name="notes" rows="3"></textarea></label><label><input name="favorite" type="checkbox">收藏</label><div class="actions"><button>保存</button><button type="button" data-close="editor">取消</button></div></form></dialog>
<dialog id="source-editor"><form id="source-form"><h2>维护信息源</h2><input name="id" type="hidden"><label>名称<input name="name" required maxlength="200"></label><label>主页链接<input name="url" type="url" required></label><label>关注领域<input name="category"></label><label><input name="enabled" type="checkbox" checked>启用</label><div class="actions"><button>保存</button><button type="button" data-close="source-editor">取消</button></div></form></dialog>
<dialog id="detail"><button type="button" data-close="detail">关闭</button><div id="detail-content"></div></dialog>
<script src="/app.js" defer></script></body></html>
